<style>
:root{--bg:#fff;--ink:#111;--gap:12px;--max:1760px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
body.no-scroll{overflow:hidden}
header{padding:clamp(34px,5vw,70px) 20px clamp(28px,4vw,52px);text-align:center}
h1{margin:0;font-size:clamp(22px,2.3vw,40px);line-height:1.15;font-weight:700;letter-spacing:clamp(.10em,.75vw,.18em)}
main{width:min(var(--max),calc(100% - 24px));margin:0 auto;padding-bottom:12px}
.gallery{columns:4 300px;column-gap:var(--gap)}
.gallery-item{display:block;width:100%;padding:0;margin:0 0 var(--gap);border:0;background:transparent;overflow:hidden;break-inside:avoid;cursor:zoom-in}
.gallery-item img{display:block;width:100%;height:auto;transition:transform 240ms cubic-bezier(.22,.75,.2,1),filter 240ms ease,opacity 240ms ease;will-change:transform}
@media (hover:hover) and (pointer:fine){.gallery-item:hover img{transform:scale(1.025);filter:brightness(.94) contrast(1.03)}}
.lightbox{position:fixed;inset:0;z-index:9999;display:none;background:rgba(5,5,5,.97);color:#fff;opacity:0;transition:opacity 160ms ease;overscroll-behavior:contain}
.lightbox.open{display:block;opacity:1}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none}
.photo-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:56px 78px;overflow:hidden}
.lightbox-img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transform-origin:center center;will-change:transform,opacity;transition:opacity 150ms ease;user-select:none;-webkit-user-drag:none;cursor:default}
.lightbox-img.dragging{cursor:grabbing} .lightbox-img.switching{opacity:.18}
.control{position:absolute;z-index:4;width:46px;height:46px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.34);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background 160ms ease,transform 160ms ease}
.control:hover{background:rgba(255,255,255,.15)}
.control svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.close{top:18px;right:18px} .prev{left:18px;top:50%;transform:translateY(-50%)} .next{right:18px;top:50%;transform:translateY(-50%)}
.prev:hover,.next:hover{transform:translateY(-50%) scale(1.05)}
.zoom-controls{position:absolute;z-index:4;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px} .zoom-controls .control{position:static}
@media(max-width:900px){:root{--gap:8px}main{width:calc(100% - 16px)}.gallery{columns:3 220px}.photo-wrap{padding:58px 50px 72px}.prev{left:8px}.next{right:8px}.close{top:max(10px,env(safe-area-inset-top));right:10px}.zoom-controls{bottom:max(10px,env(safe-area-inset-bottom))}}
@media(max-width:620px){header{padding-left:12px;padding-right:12px}h1{letter-spacing:.10em}.gallery{columns:2 150px}.photo-wrap{padding:58px 8px 70px}.control{width:42px;height:42px}.prev,.next{top:auto;bottom:max(10px,env(safe-area-inset-bottom));transform:none}.prev{left:10px}.next{right:10px}.prev:hover,.next:hover{transform:scale(1.05)}}
@media(max-width:410px){.gallery{columns:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const thumbs=[...document.querySelectorAll('.gallery-item')];
const lightbox=document.getElementById('lightbox'),stage=document.getElementById('stage'),photoWrap=document.getElementById('photoWrap'),img=document.getElementById('lightboxImg');
const closeBtn=document.getElementById('closeBtn'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),zoomInBtn=document.getElementById('zoomInBtn'),zoomOutBtn=document.getElementById('zoomOutBtn'),resetZoomBtn=document.getElementById('resetZoomBtn');
let current=0,zoom=1,panX=0,panY=0,dragging=false,dragStartX=0,dragStartY=0,panStartX=0,panStartY=0,touchStartX=0,touchStartY=0,touchMoved=false;
const MIN_ZOOM=1,MAX_ZOOM=4;
function applyTransform(){img.style.transform=`translate3d(${panX}px,${panY}px,0) scale(${zoom})`;img.style.cursor=zoom>1?(dragging?'grabbing':'grab'):'default'}
function resetView(){zoom=1;panX=0;panY=0;applyTransform()}
function setZoom(v){zoom=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,v));if(zoom<=1){panX=0;panY=0}applyTransform()}
function changeZoom(d){setZoom(zoom+d)}
function preloadNeighbors(){let a=new Image(),b=new Image();a.src=images[(current-1+images.length)%images.length];b.src=images[(current+1)%images.length]}
function showImage(i){current=(i+images.length)%images.length;resetView();img.classList.add('switching');let l=new Image();l.src=images[current];l.onload=()=>{img.src=l.src;requestAnimationFrame(()=>img.classList.remove('switching'));preloadNeighbors()}}
function openLightbox(i){current=i;lightbox.classList.add('open');lightbox.setAttribute('aria-hidden','false');document.body.classList.add('no-scroll');showImage(current);closeBtn.focus({preventScroll:true})}
function closeLightbox(){lightbox.classList.remove('open');lightbox.setAttribute('aria-hidden','true');document.body.classList.remove('no-scroll');resetView()}
function previousImage(){showImage(current-1)} function nextImage(){showImage(current+1)}
thumbs.forEach((t,i)=>t.addEventListener('click',()=>openLightbox(i)));closeBtn.addEventListener('click',closeLightbox);prevBtn.addEventListener('click',previousImage);nextBtn.addEventListener('click',nextImage);zoomInBtn.addEventListener('click',()=>changeZoom(.5));zoomOutBtn.addEventListener('click',()=>changeZoom(-.5));resetZoomBtn.addEventListener('click',resetView);
document.addEventListener('keydown',e=>{if(!lightbox.classList.contains('open'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft'&&zoom===1)previousImage();if(e.key==='ArrowRight'&&zoom===1)nextImage();if(e.key==='+'||e.key==='=')changeZoom(.5);if(e.key==='-')changeZoom(-.5);if(e.key==='0')resetView()});
photoWrap.addEventListener('wheel',e=>{if(!lightbox.classList.contains('open'))return;e.preventDefault();setZoom(zoom+(e.deltaY<0?.25:-.25))},{passive:false});
photoWrap.addEventListener('dblclick',e=>{e.preventDefault();zoom===1?setZoom(2):resetView()});
img.addEventListener('pointerdown',e=>{if(zoom<=1)return;dragging=true;dragStartX=e.clientX;dragStartY=e.clientY;panStartX=panX;panStartY=panY;img.setPointerCapture(e.pointerId);img.classList.add('dragging')});
img.addEventListener('pointermove',e=>{if(!dragging)return;panX=panStartX+(e.clientX-dragStartX);panY=panStartY+(e.clientY-dragStartY);applyTransform()});
img.addEventListener('pointerup',e=>{dragging=false;img.classList.remove('dragging');try{img.releasePointerCapture(e.pointerId)}catch(_){}});img.addEventListener('pointercancel',()=>{dragging=false;img.classList.remove('dragging')});
stage.addEventListener('touchstart',e=>{if(e.touches.length!==1||zoom!==1)return;touchMoved=false;touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchmove',e=>{if(e.touches.length!==1||zoom!==1)return;let dx=e.touches[0].clientX-touchStartX,dy=e.touches[0].clientY-touchStartY;if(Math.abs(dx)>12||Math.abs(dy)>12)touchMoved=true},{passive:true});
stage.addEventListener('touchend',e=>{if(zoom!==1||!touchMoved||!e.changedTouches.length)return;let dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.15)dx<0?nextImage():previousImage()},{passive:true});
stage.addEventListener('click',e=>{if(e.target===stage||e.target===photoWrap)closeLightbox()});
</script>
</body>
